<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birch – AgencyBloc Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8EC859;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }

    header span {
      font-size: 12px;
      color: #888;
      margin-left: auto;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.bot  { align-items: flex-start; }

    .msg-label {
      font-size: 11px;
      color: #999;
      padding: 0 4px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .msg.user {
      background: #8EC859;
      color: #1a3a00;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      background: #fff;
      border: 1px solid #e5e5e5;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .msg.error {
      background: #fff0f0;
      border-color: #ffcccc;
      color: #c00;
    }

    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 12px;
    }

    .chip {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #d0d0d0;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chip:hover { background: #f5f5f5; color: #1a1a1a; }

    footer {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fafafa;
    }

    #input:focus { border-color: #8EC859; background: #fff; }

    #sendBtn {
      background: #8EC859;
      color: #1a3a00;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #sendBtn:disabled { opacity: 0.5; cursor: default; }

    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 14px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-dot"></div>
  <h1>Birch — AgencyBloc Assistant</h1>
  <span>birch-proxy-qtou.vercel.app</span>
</header>

<div id="chat"></div>

<div id="chips">
  <span class="chip" onclick="useChip(this)">How many clients do we have?</span>
  <span class="chip" onclick="useChip(this)">Search for a group by name</span>
  <span class="chip" onclick="useChip(this)">List activities for a client</span>
  <span class="chip" onclick="useChip(this)">Get policy details</span>
  <span class="chip" onclick="useChip(this)">Find notes on an account</span>
</div>

<footer>
  <input id="input" placeholder="Ask about a client, group, policy, or activity..." onkeydown="if(event.key==='Enter' && !event.shiftKey) send()" />
  <button id="sendBtn" onclick="send()">Send</button>
</footer>

<script>
  const BASE = "https://birch-proxy-qtou.vercel.app/api";
  let history = [];

  const SYSTEM = `You are Birch Assistant, an AI for Birch Benefits LLC connected to AgencyBloc AMS.

When you need AgencyBloc data, respond with ONLY a raw JSON object (no markdown, no explanation) like:
{"abAction":"groups-search","abInput":{"groupName":"Aclaris"}}

Available actions and their inputs:
- groups-search: optional groupName, type, fedTaxID
- groups-detail: required groupID
- individuals-search: optional firstName, lastName, email, groupID
- individuals-detail: required individualID
- policies-search: optional policyNumber, carrier, entityID, entityTypeID
- policies-detail: required policyID
- agents-search: optional firstName, lastName, email
- carriers-search: optional carrierName
- activities-list: required entityID, entityTypeID (group=1, individual=2)
- notes-list: required entity_ID, entity_Type ("Group" or "Individual")
- all-groups: no input needed — returns full client list with count
- client-snapshot: required groupID — returns group detail + notes in one call

Rules:
- If you need a groupID but only have a name, first do groups-search, then use the ID.
- When presenting results, be concise and professional. Plain text only, no markdown symbols.
- For "how many clients" questions, use all-groups.
- Never guess at IDs — always look them up first.`;

  function useChip(el) {
    document.getElementById("input").value = el.textContent;
    document.getElementById("input").focus();
  }

  function addMsg(type, text) {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap " + (type === "user" ? "user" : "bot");
    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = type === "user" ? "You" : "Birch Assistant";
    const msg = document.createElement("div");
    msg.className = "msg " + (type === "user" ? "user" : type === "error" ? "bot error" : "bot");
    msg.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(msg);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return msg;
  }

  function showTyping() {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap bot";
    wrap.id = "typing";
    const msg = document.createElement("div");
    msg.className = "msg bot typing";
    msg.innerHTML = "<div class='dot'></div><div class='dot'></div><div class='dot'></div>";
    wrap.appendChild(msg);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function callClaude(messages) {
    const resp = await fetch(`${BASE}/claude`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 1000,
        system: SYSTEM,
        messages
      })
    });
    const data = await resp.json();
    return data.content?.[0]?.text || "";
  }

  async function callAgencyBloc(action, input) {
    const resp = await fetch(`${BASE}/agencybloc`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, input })
    });
    return await resp.json();
  }

  async function send() {
    const inputEl = document.getElementById("input");
    const btn = document.getElementById("sendBtn");
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    btn.disabled = true;
    addMsg("user", text);
    history.push({ role: "user", content: text });
    showTyping();

    try {
      let reply = await callClaude(history);

      // Check if Claude wants to call AgencyBloc
      let parsed = null;
      try {
        const cleaned = reply.trim().replace(/^```json|```$/g, "").trim();
        parsed = JSON.parse(cleaned);
      } catch {}

      if (parsed && parsed.abAction) {
        history.push({ role: "assistant", content: reply });

        let abResult;
        try {
          abResult = await callAgencyBloc(parsed.abAction, parsed.abInput || {});
        } catch (e) {
          abResult = { error: e.message };
        }

        const dataMsg = `AgencyBloc returned this data: ${JSON.stringify(abResult, null, 2)}\n\nPlease summarize this clearly and concisely for the user in plain text. No markdown, no bullet symbols.`;
        history.push({ role: "user", content: dataMsg });

        reply = await callClaude(history);
        history.push({ role: "assistant", content: reply });
      } else {
        history.push({ role: "assistant", content: reply });
      }

      removeTyping();
      addMsg("bot", reply);

    } catch (e) {
      removeTyping();
      addMsg("error", "Error: " + e.message);
    }

    btn.disabled = false;
    inputEl.focus();
  }

  // Welcome message
  addMsg("bot", "Hi! I can look up clients, groups, policies, activities, and notes from AgencyBloc. What do you need?");
</script>
</body>
</html>
